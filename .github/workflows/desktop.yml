name: Desktop checks
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python3 tests/schema_test.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - name: Run Rust tests
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content cargo-test.log -Tail 100) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$escaped"
            exit 1
          }
      - name: Build experimental Windows executable
        run: npm run tauri -- build --debug --no-bundle
      - name: Upload experimental executable
        uses: actions/upload-artifact@v4
        with:
          name: farday-roshan-windows-experimental
          path: desktop/src-tauri/target/debug/farday-roshan-desktop.exe
          if-no-files-found: error
          retention-days: 7
      - name: Build experimental Windows installer
        shell: pwsh
        run: |
          npm run tauri -- build --debug --ci --no-sign --config src-tauri/tauri.experimental.conf.json 2>&1 | Tee-Object -FilePath installer-build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content installer-build.log -Tail 100) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$escaped"
            exit 1
          }
      - name: Upload experimental installer
        uses: actions/upload-artifact@v4
        with:
          name: farday-roshan-windows-installer-experimental
          path: desktop/src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
